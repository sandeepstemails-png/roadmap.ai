name: Deploy to Vercel

# Manual trigger only — this intentionally does NOT run on push, so merging
# code never auto-deploys to production. Run it from the Actions tab when
# you're ready to deploy.
#
# Requires these repo secrets (Vercel dashboard -> project -> Settings ->
# General for the IDs, and vercel.com/account/tokens for the token):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.9"
          cache: "npm"
      - run: npm ci
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (preview)
        if: inputs.environment == 'preview'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (production)
        if: inputs.environment == 'production'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (preview)
        if: inputs.environment == 'preview'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (production)
        if: inputs.environment == 'production'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
